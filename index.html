<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de estudio 2026</title>
<meta name="theme-color" content="#FFF8EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Versión colorida: fondo crema cálido, un color franco por materia, bloques de color llenos. */
:root{
  --bg:#FFF8EE; --surface:#FFFFFF; --ink:#26201B; --mute:#756A5F; --line:#EBDFCF; --soft:#F8EEDF;
  --pen:#F2307B; --rc:#1595F5; --dip:#9D44E8; --lab:#4045C9; --ing:#F5A00B; --mute2:#9A8F84;
  --warn:#F2A11B; --warn-bg:#FFF0CF; --warn-ink:#5A3A00; --on:#FFFFFF;
  --f-disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#1B1612; --surface:#27201A; --ink:#F7EFE6; --mute:#BCAE9F; --line:#3A3128; --soft:#30281F;
  --pen:#FF6AA2; --rc:#5DB8FF; --dip:#BE7DFF; --lab:#8C90FF; --ing:#FFC24A; --mute2:#8C7F72;
  --warn-bg:#35280F; --warn-ink:#FFE2A8; --on:#1B1612; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* cinta de colores de arriba */
.cinta{display:flex;height:10px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.cinta i{flex:1}
.cinta i:nth-child(1){background:var(--pen)} .cinta i:nth-child(2){background:var(--rc)} .cinta i:nth-child(3){background:var(--dip)}
.cinta i:nth-child(4){background:var(--lab)} .cinta i:nth-child(5){background:var(--ing)}

/* cabecera */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 6px}
.marca{font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:700;font-size:15px;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.ic{text-decoration:none;color:inherit;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.leyenda,.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}

/* materias */
.m-pen{--c:var(--pen);--on:#FFFFFF} .m-rc{--c:var(--rc);--on:#FFFFFF} .m-dip{--c:var(--dip);--on:#FFFFFF} .m-lab{--c:var(--lab);--on:#FFFFFF} .m-ing{--c:var(--ing);--on:#2B1B00} .m-gen{--c:var(--mute2);--on:#FFFFFF}
:root[data-theme="dark"] .m-pen,:root[data-theme="dark"] .m-rc,:root[data-theme="dark"] .m-dip,:root[data-theme="dark"] .m-lab,:root[data-theme="dark"] .m-ing,:root[data-theme="dark"] .m-gen{--on:#1B1612}
.forma{display:inline-block;width:14px;height:14px;background:var(--c);flex:none}
.f-circulo{border-radius:50%} .f-cuadrado{border-radius:3px}
.f-rombo{transform:rotate(45deg) scale(.82);border-radius:2px}
.f-triangulo{clip-path:polygon(50% 0,100% 100%,0 100%)}
.f-hexagono{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 12px;border-radius:999px;font-weight:700;font-size:14px;
  background:color-mix(in oklab,var(--c) 18%,var(--surface));color:var(--ink);border:1.5px solid color-mix(in oklab,var(--c) 55%,transparent)}

/* hoy */
.dia-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 4px}
.dia-nav .fecha{font-family:var(--f-disp);font-weight:800;font-size:clamp(44px,9vw,84px);line-height:.95;letter-spacing:-.035em;margin:0}
.dia-nav .fecha::first-letter{text-transform:uppercase}
.dia-nav .sub{color:var(--mute);margin:6px 0 0;max-width:46em}
.flechas{display:flex;gap:8px}
.flechas button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:800}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));margin-top:18px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:20px;min-width:0}
.card h3{font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:4px 0 12px}
.vacio{color:var(--mute);margin:0}

.clase{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:13px 15px;border-radius:18px;margin-top:10px;
  background:color-mix(in oklab,var(--c) 17%,var(--surface));border-left:9px solid var(--c)}
.clase .hora{font-family:var(--f-mono);font-size:13px;font-weight:700;color:color-mix(in oklab,var(--c) 70%,var(--ink));grid-row:span 2;padding-top:2px}
.clase .t{font-weight:700;line-height:1.3}
.clase .d{font-size:14px;color:var(--mute)}
.clase.parcial{background:var(--c);color:var(--on);border-left-color:var(--c)}
.clase.parcial .hora,.clase.parcial .d{color:inherit}

.tarea{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:start;padding:14px;border-radius:20px;margin-top:10px;
  background:color-mix(in oklab,var(--c) 13%,var(--surface));border-left:9px solid var(--c)}
.chk{width:48px;height:48px;border-radius:15px;border:3px solid var(--c);background:var(--surface);display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--on)}
.chk[data-s="1"]{background:linear-gradient(135deg,var(--c) 50%,var(--surface) 50%)}
.chk[data-s="2"]{background:var(--c)}
.tarea .t{font-weight:700;line-height:1.3}
.tarea .d{font-size:14.5px;color:var(--mute);margin-top:2px}
.tarea[data-s="2"]{background:var(--soft);border-left-color:color-mix(in oklab,var(--c) 45%,var(--soft))}
.tarea[data-s="2"] .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.pill{font-family:var(--f-mono);font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface);color:var(--mute);border:1px solid var(--line)}
.pill.prov{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn)}
.atras{border:2px solid var(--warn);background:var(--warn-bg);color:var(--warn-ink);border-radius:20px;padding:12px 16px;margin-top:14px}
.atras b{font-family:var(--f-disp)}

/* parciales: bloques de color lleno */
.par{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-radius:22px;margin-top:12px;
  background:var(--c);color:var(--on)}
.par .n{font-family:var(--f-disp);font-weight:800;font-size:54px;line-height:.9;letter-spacing:-.04em;min-width:2ch;text-align:center}
.par .n small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;opacity:.85}
.par .t{font-weight:800;font-size:18px;line-height:1.2}
.par .d{font-size:14px;opacity:.92}
.par .forma{background:var(--on)}
.par.pasado{opacity:.55}
.barra{height:10px;border-radius:99px;background:color-mix(in oklab,var(--on) 28%,transparent);margin-top:8px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--on);border-radius:99px}

/* semana */
.sem{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));margin-top:18px}
.sem .dia{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:0 14px 14px;min-width:0;overflow:hidden}
.sem .dia.hoy{border:3px solid var(--ink);background:color-mix(in oklab,var(--ing) 12%,var(--surface))}
.tira{display:flex;height:10px;margin:0 -14px 10px}
.tira i{flex:1;background:var(--c)}
.tira i.nada{background:var(--line)}
.sem .dia h4{font-family:var(--f-disp);font-size:20px;font-weight:800;margin:0 0 6px;text-transform:capitalize}
.sem .it{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.3;margin-top:7px;padding:7px 9px;border-radius:12px;
  background:color-mix(in oklab,var(--c) 16%,var(--surface))}
.sem .it .forma{margin-top:3px}

.aviso{margin-top:22px;font-size:13.5px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
[hidden]{display:none !important}
</style>
</head>

</div>

 y preguntas.","opt":false}]};
const LS = 'evaPlan.v1';
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
const MAT = Object.fromEntries(DATA.materias.map(m => [m.id, m]));

let estado = {done:{}, tema:null};
try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s) estado = Object.assign(estado, s); } catch(e){}
const guardar = () => { try { localStorage.setItem(LS, JSON.stringify(estado)); } catch(e){} };

const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const sumar = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const lunesDe = d => sumar(d, -((d.getDay()+6)%7));
const largo = d => DIAS[d.getDay()] + ' ' + d.getDate();
const completo = d => DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const forma = id => '<i class="forma f-' + MAT[id].forma + '"></i>';
const chip = id => '<span class="chip m-' + id + '">' + forma(id) + esc(MAT[id].corto) + '</span>';
const tag = id =>'<span class="tag m-' + id + '" style="--c:var(--' + MAT[id].css + ')">' + forma(id) + esc(MAT[id].corto) + '</span>';

let hoyReal = new Date(); hoyReal.setHours(0,0,0,0);
let dia = new Date(hoyReal);
// Si se abre antes de que empiece el plan, mostrar el primer día del plan.
const ini = parse(DATA.inicio), fin = parse(DATA.fin);
if (dia < ini) dia = new Date(ini);
if (dia > fin) dia = new Date(fin);
let semana = lunesDe(dia);

function eventosDe(f){ return DATA.eventos.filter(e => e.f === f).sort((a,b) => (a.h||'').localeCompare(b.h||'')); }
function tareasDe(f){ return DATA.sesiones.filter(s => s.f === f); }
function estadoDe(id){ return estado.done[id] || 0; }

function htmlEvento(e){
  const m = MAT[e.m];
  return '<div class="clase m-' + e.m + (e.parcial ? ' parcial' : '') + '" style="--c:var(--' + m.css + ')">' +
    '<div class="hora">' + esc(e.h || '') + '</div><div class="t">' + esc(e.t) + '</div>' +
    '<div class="d">' + esc(m.nombre) + (e.d ? ' · ' + esc(e.d) : '') + '</div></div>';
}
const BLOQUE = {'1':'Bloque 1','2':'Bloque 2','S':'Sábado','O':'Opcional'};
const TIPO = {lectura:'Lectura',repaso:'Repaso',armar:'Armar y leer',preguntas:'Preguntas'};
const NIVEL = {1:'A fondo',2:'Para responder preguntas',3:'Esquema'};
const dur = m => m % 60 === 0 ? (m / 60) + ' h' : (m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min');
function htmlTarea(s){
  const st = estadoDe(s.id), m = MAT[s.m];
  return '<div class="tarea m-' + s.m + '" data-s="' + st + '" style="--c:var(--' + m.css + ')">' +
    '<button class="chk" type="button" data-id="' + s.id + '" data-s="' + st + '" aria-label="Marcar: ' + esc(s.t) + '">' + (st === 2 ? '✓' : '') + '</button>' +
    '<div><div class="t">' + esc(s.t) + '</div>' + (s.d ? '<div class="d">' + esc(s.d) + '</div>' : '') +
    '<div class="meta">' + tag(s.m) + '<span class="pill">' + dur(s.min) + '</span><span class="pill">' + (BLOQUE[s.b] || '') + '</span><span class="pill">' + (TIPO[s.tipo] || '') + '</span>' +
    (s.n ? '<span class="pill">Nivel ' + s.n + ': ' + NIVEL[s.n] + '</span>' : '') + (s.prov ? '<span class="pill prov">provisorio</span>' : '') + '</div></div></div>';
}
function tareasHtml(ta){
  const orden = {'1':1,'2':2,'S':0,'O':3};
  return ta.slice().sort((a,b) => (orden[a.b] - orden[b.b])).map(htmlTarea).join('');
}

function pintarHoy(){
  const f = ymd(dia);
  document.getElementById('h-fecha').textContent = largo(dia);
  document.getElementById('h-sub').textContent = completo(dia) + (ymd(dia) === ymd(hoyReal) ? ' · hoy' : '') + ' · ' + ((DATA.horarios || {})[dia.getDay()] || '');
  const ev = eventosDe(f);
  const delDia = [...new Set(ev.map(e => e.m).concat(tareasDe(f).map(s => s.m)))].filter(m => m !== 'gen');
  document.getElementById('h-chips').innerHTML = delDia.map(chip).join('');
  document.getElementById('h-clases').innerHTML = (ev.length ? ev.map(htmlEvento).join('') : '<p class="vacio">Sin clases ni parciales cargados este día.</p>');
  const ta = tareasDe(f);
  document.getElementById('h-tareas').innerHTML = ta.length ? tareasHtml(ta) + '<p class="aviso">' + dur(ta.reduce((a, s) => a + s.min, 0)) + ' planificadas este día.</p>' : '<p class="vacio">Nada planificado en casa este día.</p>';
  // atrasadas: sesiones anteriores a este día que no están completas (las opcionales no cuentan)
  const atras = DATA.sesiones.filter(s => s.f < f && estadoDe(s.id) !== 2 && !s.opt);
  const caja = document.getElementById('h-atras');
  caja.innerHTML = atras.length ? '<div class="atras"><b>' + atras.length + ' sin completar de días anteriores.</b> Si querés que se reorganice el plan, tocá "Copiar avance" y mandá el texto por WhatsApp.</div>' : '';
  // próximo parcial
  const prox = DATA.parciales.filter(p => p.f >= f).sort((a,b) => a.f.localeCompare(b.f))[0];
  const px = document.getElementById('h-prox'), pt = document.getElementById('h-prox-tit');
  if (prox) { const dd = Math.round((parse(prox.f) - dia) / 864e5); pt.textContent = MAT[prox.m].nombre;
    px.innerHTML = '<div class="par m-' + prox.m + '" style="--c:var(--' + MAT[prox.m].css + ')"><div class="n">' + dd + '<small>días</small></div><div><div class="t">' + esc(prox.t) + '</div><div class="d">' + completo(parse(prox.f)) + '</div></div><div>' + forma(prox.m) + '</div></div>'; }
  else { pt.textContent = 'Parcial'; px.innerHTML = '<p class="vacio">No quedan parciales cargados.</p>'; }
}

function pintarSemana(){
  const dias = [...Array(7)].map((_, i) => sumar(semana, i));
  document.getElementById('s-tit').textContent = 'Semana del ' + semana.getDate();
  document.getElementById('s-sub').textContent = MESES[semana.getMonth()] + ' ' + semana.getFullYear();
  document.getElementById('s-dias').innerHTML = dias.map(d => {
    const f = ymd(d), ev = eventosDe(f), ta = tareasDe(f);
    const items = ev.map(e => '<div class="it m-' + e.m + '">' + forma(e.m) + '<span><b>' + esc(e.h||'') + '</b> ' + esc(e.t) + '</span></div>').join('') +
      ta.map(s => '<div class="it m-' + s.m + '">' + forma(s.m) + '<span>' + (estadoDe(s.id) === 2 ? '✓ ' : '') + esc(s.t) + '</span></div>').join('');
    const ms = [...new Set(ev.map(e => e.m).concat(ta.map(s => s.m)))];
    const tira = '<div class="tira">' + (ms.length ? ms.map(m => '<i class="m-' + m + '"></i>').join('') : '<i class="nada"></i>') + '</div>';
    return '<div class="dia' + (f === ymd(hoyReal) ? ' hoy' : '') + '">' + tira + '<h4>' + largo(d) + '</h4>' + (items || '<p class="vacio">Libre</p>') + '</div>';
  }).join('');
}

function horasPara(p){
  // Sesiones de la misma materia entre el parcial anterior de esa materia (sin incluirlo) y este (incluido).
  const prev = DATA.parciales.filter(q => q.m === p.m && q.f < p.f).map(q => q.f).sort().pop() || '0000-00-00';
  const ss = DATA.sesiones.filter(s => s.m === p.m && s.f > prev && s.f <= p.f);
  const firmes = ss.filter(s => !s.opt), opc = ss.filter(s => s.opt);
  const hechas = firmes.filter(s => estadoDe(s.id) === 2).reduce((a, s) => a + s.min, 0) + firmes.filter(s => estadoDe(s.id) === 1).reduce((a, s) => a + s.min / 2, 0);
  const tot = firmes.reduce((a, s) => a + s.min, 0);
  return {tot, hechas, opc: opc.reduce((a, s) => a + s.min, 0)};
}
function pintarParciales(){
  const f = ymd(hoyReal);
  document.getElementById('p-lista').innerHTML = DATA.parciales.slice().sort((a,b) => a.f.localeCompare(b.f)).map(p => {
    const dd = Math.round((parse(p.f) - hoyReal) / 864e5), h = horasPara(p);
    const hs = '<br>Estudio planificado: ' + dur(h.tot) + (h.opc ? ' (+ ' + dur(h.opc) + ' opcionales)' : '') + ' · hecho: ' + dur(Math.round(h.hechas));
    const pct = h.tot ? Math.min(100, Math.round(h.hechas / h.tot * 100)) : 0;
    return '<div class="par m-' + p.m + (p.f < f ? ' pasado' : '') + '" style="--c:var(--' + MAT[p.m].css + ')"><div class="n">' + (dd >= 0 ? dd : '·') + '<small>' + (dd >= 0 ? 'días' : 'hecho') + '</small></div>' +
      '<div><div class="t">' + esc(MAT[p.m].nombre) + '</div><div class="d">' + completo(parse(p.f)) + ' · ' + esc(p.t) + hs + '</div><div class="barra" title="' + pct + ' % del estudio planificado"><i style="width:' + pct + '%"></i></div></div><div>' + forma(p.m) + '</div></div>';
  }).join('');
}

function pintar(){ pintarHoy(); pintarSemana(); pintarParciales(); }

function textoAvance(){
  const hoy = ymd(hoyReal), L = ['AVANCE ' + completo(hoyReal)];
  const por = {};
  DATA.sesiones.filter(s => s.f <= hoy && !s.opt).forEach(s => { (por[s.m] = por[s.m] || []).push(s); });
  Object.keys(por).forEach(m => {
    const a = por[m], h = a.filter(s => estadoDe(s.id) === 2), p = a.filter(s => estadoDe(s.id) === 1), n = a.filter(s => !estadoDe(s.id));
    L.push('', MAT[m].nombre + ': ' + h.length + ' hechas, ' + p.length + ' parciales, ' + n.length + ' pendientes');
    p.forEach(s => L.push('  parcial: ' + s.f + ' ' + s.t));
    n.forEach(s => L.push('  pendiente: ' + s.f + ' ' + s.t));
  });
  const fut = DATA.sesiones.filter(s => s.f > hoy && estadoDe(s.id)).length;
  if (fut) L.push('', 'Adelantadas: ' + fut);
  L.push('', 'Plan: ' + DATA.version);
  return L.join('\n');
}
function aviso(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2400); }

document.addEventListener('click', e => {
  const c = e.target.closest('.chk');
  if (c) { const id = c.dataset.id; estado.done[id] = ((estado.done[id] || 0) + 1) % 3; if (!estado.done[id]) delete estado.done[id]; guardar(); pintar(); }
});
document.getElementById('h-prev').onclick = () => { dia = sumar(dia, -1); pintarHoy(); };
document.getElementById('h-next').onclick = () => { dia = sumar(dia, 1); pintarHoy(); };
document.getElementById('h-hoy').onclick = () => { dia = new Date(hoyReal < ini ? ini : hoyReal); pintarHoy(); };
document.getElementById('s-prev').onclick = () => { semana = sumar(semana, -7); pintarSemana(); };
document.getElementById('s-next').onclick = () => { semana = sumar(semana, 7); pintarSemana(); };
document.getElementById('s-hoy').onclick = () => { semana = lunesDe(hoyReal < ini ? ini : hoyReal); pintarSemana(); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['hoy','semana','parciales'].forEach(v => document.getElementById('v-' + v).hidden = v !== b.dataset.v);
});
document.getElementById('btn-copiar').onclick = async () => {
  const t = textoAvance();
  try { await navigator.clipboard.writeText(t); aviso('Copiado. Pegalo en WhatsApp.'); }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); aviso('Copiado. Pegalo en WhatsApp.'); } catch(_) { aviso('No se pudo copiar'); } a.remove(); }
};
document.getElementById('btn-tema').onclick = () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; estado.tema = r.dataset.theme; guardar();
};
if (estado.tema) document.documentElement.dataset.theme = estado.tema;
document.getElementById('aviso').textContent = DATA.aviso || '';
document.getElementById('leyenda').innerHTML = DATA.materias.filter(m => m.id !== 'gen').map(m => chip(m.id)).join('');
pintar();
</script>
</body>
